# JVM 内存：Flutter + Kotlin 编译需要较大堆内存
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# 并行构建，加快 CI 出包
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 全家桶
android.useAndroidX=true
android.enableJetifier=true

# 让 Gradle 使用更少的内存做配置缓存
org.gradle.configuration-cache=false
# 关闭 Kotlin 增量编译：pub 缓存在 C 盘、项目在 D 盘，
# KGP 增量缓存跨盘符写入会报 "this and base files have different roots" 导致构建失败。
# 受影响的都是小型插件模块，全量编译耗时可忽略。
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
# 已完成内置 Kotlin 迁移（app 不再应用 kotlin-android），开启 AGP 内置 Kotlin
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# ====== 体积瘦身 ======
# 关闭 Flutter 插件的默认 ABI 全量打包（它会 clear() 掉 build.gradle 里
# 的 abiFilters），改用 app/build.gradle.kts 中指定的 arm64-v8a 单 ABI
disable-abi-filtering=true
